# =============================================================================
# OpenCodeWEBsUI â€” CI/CD Pipeline
#
# Runs on every push/PR to Dev:
#   1. Pre-mutation backup snapshot
#   2. Install dependencies (UI + DO worker)
#   3. TypeScript type check
#   4. Polyglot validation (Rust, Python, GLSL)
#   5. Vite production build
#   6. Deploy DO Worker (GlobeRelay) â€” push to Dev only
#   7. Deploy Pages (production) â€” push to Dev only
#   8. Commit ledger updates with triple-authorship standard
# =============================================================================

name: Deploy

on:
  push:
    branches: [Dev]
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

jobs:
  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  # Job 1 â€” Build, Validate & Audit
  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  build-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      # â”€â”€ Step 1: Checkout â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # â”€â”€ Step 2: Setup Node.js â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            do-worker/package-lock.json

      # â”€â”€ Step 3: Install dependencies â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      - name: Install Dependencies
        run: |
          npm ci
          cd do-worker && npm ci

      # â”€â”€ Step 4: Pre-Mutation Restore Point â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      # One meaningful rolling backup branch: backup/restore-point always
      # points at the last state before this run's mutation (force-updated
      # on every run â€” no timestamp branch accumulation).
      - name: Establish Pre-Mutation Restore Point
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RESTORE_BRANCH="backup/restore-point"
          echo "Updating restore point branch: ${RESTORE_BRANCH}"

          git config user.name "ABsUP"
          git config user.email "ABsUP@users.noreply.github.com"

          git branch -f "${RESTORE_BRANCH}" HEAD
          git push --force origin "${RESTORE_BRANCH}"

          mkdir -p OpenCodeWEBsPRD
          cat >> OpenCodeWEBsPRD/ToDo.md <<-EOF

          ### Snapshot Ledger
          - **Restore point:** `${RESTORE_BRANCH}` â†’ `${{ github.sha }}`
          - **Date:** $(date)
          EOF

      # â”€â”€ Step 5: TypeScript Type Check â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      - name: TypeScript Check (UI)
        run: npx tsc --noEmit

      - name: TypeScript Check (DO Worker)
        run: |
          cd do-worker
          npx tsc --noEmit

      # â”€â”€ Step 6: Polyglot Validation â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      - name: Validate Rust WASM Module
        run: |
          if [ -d "rswasm-globe-physics" ]; then
            cd rswasm-globe-physics && cargo check 2>&1 || echo "Rust check skipped (cargo not available or build issues)"
          else
            echo "No rswasm-globe-physics directory â€” skipping Rust validation"
          fi

      - name: Validate Python Data
        run: |
          if [ -f "scripts/generate_cities.py" ]; then
            python3 scripts/generate_cities.py --validate 2>&1 || echo "Python validation skipped or failed"
          else
            echo "No generate_cities.py â€” skipping Python validation"
          fi

      - name: Validate GLSL Shaders
        run: |
          SHADER_DIR="shaders"
          if [ -d "$SHADER_DIR" ]; then
            COUNT=$(find "$SHADER_DIR" -name '*.vert' -o -name '*.frag' | wc -l)
            echo "Found $COUNT shader files"
            find "$SHADER_DIR" -type f \( -name '*.vert' -o -name '*.frag' \) -exec echo "  âœ“ {}" \;
          else
            echo "No shaders directory â€” skipping GLSL validation"
          fi

      # â”€â”€ Step 7: Vite Production Build â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      - name: Build (Vite)
        run: npx vite build

      # â”€â”€ Step 7b: Secret Leak Prevention Scan â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      - name: Secret Leak Prevention Scan
        run: |
          echo "Scanning for leaked credentials (AWS, GitHub, Slack, Stripe, Google, PEM keys)..."
          FAIL=0
          scan() {
            local pattern="$1" label="$2"
            local matches
            matches=$(grep -rInE "$pattern" \
              --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.git \
              --exclude-dir=coverage --exclude-dir=.wrangler --exclude-dir=.github \
              --exclude="package-lock.json" --exclude="*.min.js" --exclude="*.map" \
              . 2>/dev/null || true)
            if [ -n "$matches" ]; then
              echo "::error::[$label] potential leak detected:"
              echo "$matches" | head -20
              FAIL=1
            fi
          }
          scan 'AKIA[0-9A-Z]{16}' "AWS Access Key"
          scan '-----BEGIN [A-Z ]*PRIVATE KEY-----' "Private PEM Key"
          scan 'ghp_[A-Za-z0-9]{36}' "GitHub PAT"
          scan 'github_pat_[A-Za-z0-9_]{22,}' "GitHub Fine-Grained PAT"
          scan 'xox[baprs]-[A-Za-z0-9-]{10,}' "Slack Token"
          scan 'sk_live_[0-9a-zA-Z]{16,}' "Stripe Secret Key"
          scan 'AIza[0-9A-Za-z_-]{35}' "Google API Key"
          if [ $FAIL -ne 0 ]; then
            echo "::error::Secret leak scan failed â€” remove leaked credentials before committing."
            exit 1
          fi
          echo "âœ… No leaked secrets detected."

      # â”€â”€ Step 8: Commit Ledger Updates â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      - name: Commit Changes (Triple-Authorship Standard)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: |
            robot: OpenCodeWEBsUI automated build & ledger update [skip ci]

            Co-authored-by: opencodeweb[bot] <311941023+opencodeweb[bot]@users.noreply.github.com>
            Co-authored-by: OpenCodeWEB <OpenCodeWEB@users.noreply.github.com>
          branch: ${{ github.head_ref || github.ref_name }}
          commit_author: "ABsUP <ABsUP@users.noreply.github.com>"
          commit_user_name: "ABsUP"
          commit_user_email: "ABsUP@users.noreply.github.com"

  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  # Job 2 â€” Deploy DO Worker (GlobeRelay)
  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  deploy-do-worker:
    needs: build-and-audit
    if: github.event_name == 'push' && github.ref == 'refs/heads/Dev'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: do-worker/package-lock.json

      - name: Install Dependencies
        run: cd do-worker && npm ci

      - name: Deploy GlobeRelay DO Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          cd do-worker
          npx wrangler deploy

  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  # Job 3 â€” Deploy Pages (Production)
  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  deploy-pages:
    needs: build-and-audit
    if: github.event_name == 'push' && github.ref == 'refs/heads/Dev'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npx vite build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          npx wrangler pages deploy dist --branch main --project-name pocwu

